# Services on Render — Web Service (фронт + API-прокси)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: worksheet
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: google/gemini-2.0-flash-001
      - key: CONTEXT_OCR_MODEL
        value: qwen/qwen3-vl-235b-a22b-instruct
      - key: CONTEXT_PDF_MAX_PAGES
        value: "0"
      - key: PDF_VISION_MODE
        value: sparse
      - key: CONTEXT_EXTRACT_TIMEOUT_MS
        value: "300000"
      - key: APP_URL
        value: https://worksheet-rphn.onrender.com
